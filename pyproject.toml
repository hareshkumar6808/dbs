[project]
name = "aeropulse"
version = "1.0.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.135.1",
  "uvicorn==0.41.0",
  "SQLAlchemy==2.0.48",
  "GeoAlchemy2==0.18.1",
  "psycopg[binary]==3.3.3",
  "alembic==1.18.4",
  "pydantic-settings==2.13.1",
  "neo4j==6.1.0",
  "httpx==0.28.1"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires a migrated, seeded PostGIS test database"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401"]
