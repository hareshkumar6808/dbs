name: AeroPulse checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: aeropulse_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only_password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:test_only_password@localhost:5432/aeropulse_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:test_only_password@localhost:5432/aeropulse_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q backend api scripts migrations
      - run: ruff check backend api scripts tests
      - run: python -m scripts.setup
      - run: pytest -q
      - run: npm ci
      - run: npm run lint && npm run build
      - run: npx playwright install --with-deps chromium
      - run: python -m uvicorn backend.main:app --port 8000 &
      - run: npm run test:e2e
